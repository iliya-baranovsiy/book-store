services:

  backend:
    build:
      context: ./backEnd

    container_name: book_backend

    env_file:
      - ./backEnd/.env

    expose:
      - "8000"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - uploads_data:/app/app/uploads

    restart: unless-stopped


  postgres:
    image: postgres:16-alpine

    container_name: book_postgres

    env_file:
      - ./backEnd/.env

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile

    container_name: book_nginx

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  postgres_data:

  uploads_data: