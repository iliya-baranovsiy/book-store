server {
    listen 80;

    server_name book-storchik.xyz www.book-storchik.xyz;

    return 301 https://$host$request_uri;
}


server {
    listen 443 ssl;

    server_name book-storchik.xyz www.book-storchik.xyz;


    ssl_certificate /etc/letsencrypt/live/book-storchik.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/book-storchik.xyz/privkey.pem;


    root /usr/share/nginx/html;
    index index.html;


    location / {
        try_files $uri /index.html;
    }


    location /api/ {
        proxy_pass https://backend:8000;


        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto https;
    }
}